name: Publish queue

on:
  push:
    branches: [main]
    paths:
      - publish_queue.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Сертификаты Минцифры
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: |
          curl -fsSL https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt -o /tmp/root.crt
          curl -fsSL https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt -o /tmp/sub.crt
          sudo cp /tmp/root.crt /usr/local/share/ca-certificates/russian_trusted_root_ca.crt
          sudo cp /tmp/sub.crt /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt
          sudo update-ca-certificates
      - name: Восстановить отметку о выполнении
        uses: actions/cache/restore@v4
        with:
          path: .queue_done
          key: publish-queue-done-${{ github.run_id }}
          restore-keys: publish-queue-done-
      - name: Прочитать отметку
        id: done
        run: echo "value=$(cat .queue_done 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
      - name: Выполнить очередь
        env:
          QUEUE_DONE_HASH: ${{ steps.done.outputs.value }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHANNEL_ID: ${{ secrets.MAX_CHANNEL_ID }}
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: python publish_queue.py
      - name: Сохранить отметку
        run: python publish_queue.py --hash-only > .queue_done
      - name: Сохранить в кеш
        uses: actions/cache/save@v4
        with:
          path: .queue_done
          key: publish-queue-done-${{ github.run_id }}
