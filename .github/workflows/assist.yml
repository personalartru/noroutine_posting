name: Comment assistant

on:
  push:
    branches: [main]
    paths:
      - assist_queue.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Сгенерировать ответ
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python make_comment.py
      - name: Сохранить ответы и трекер
        run: |
          git config user.name "personalartru"
          git config user.email "personalartru@users.noreply.github.com"
          git add assist_answers.md commenting_tracker.md
          git diff --cached --quiet || git commit -m "chore: ответ для комментинга [skip ci]" || true
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
