name: Watch MAX bot events

on:
  schedule:
    - cron: "*/9 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Сертификаты Минцифры
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: |
          curl -fsSL https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt -o /tmp/root.crt
          curl -fsSL https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt -o /tmp/sub.crt
          sudo cp /tmp/root.crt /usr/local/share/ca-certificates/russian_trusted_root_ca.crt
          sudo cp /tmp/sub.crt /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt
          sudo update-ca-certificates
      - name: Собрать события
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHANNEL_ID: ${{ secrets.MAX_CHANNEL_ID }}
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: python max_watch.py
      - name: Сохранить журнал и offset
        run: |
          git config user.name "personalartru"
          git config user.email "personalartru@users.noreply.github.com"
          git add max_events.log max_offset.txt
          git diff --cached --quiet || git commit -m "chore: события MAX-бота [skip ci]" || true
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
