name: Watch MAX bot events

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Сертификаты Минцифры
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: |
          curl -fsSL https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt -o /tmp/root.crt
          curl -fsSL https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt -o /tmp/sub.crt
          sudo cp /tmp/root.crt /usr/local/share/ca-certificates/russian_trusted_root_ca.crt
          sudo cp /tmp/sub.crt /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt
          sudo update-ca-certificates
      - name: Восстановить offset и журнал
        uses: actions/cache/restore@v4
        with:
          path: |
            max_offset.txt
            max_events.log
            max_channel_id.txt
          key: max-watch-state-${{ github.run_id }}
          restore-keys: max-watch-state-
      - name: Собрать события
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHANNEL_ID: ${{ secrets.MAX_CHANNEL_ID }}
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: python max_watch.py
      - name: Опубликовать посты запуска, если канал найден
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: |
          if [ -s max_channel_id.txt ]; then
            ID=$(cat max_channel_id.txt)
            echo "Канал найден: $ID — публикую посты запуска"
            MAX_CHANNEL_ID="$ID" python publish_max.py all
          else
            echo "Канал пока не найден — жду события bot_added"
          fi
      - name: Подготовить файлы состояния
        run: touch max_offset.txt max_events.log
      - name: Сохранить состояние
        uses: actions/cache/save@v4
        with:
          path: |
            max_offset.txt
            max_events.log
            max_channel_id.txt
          key: max-watch-state-${{ github.run_id }}
