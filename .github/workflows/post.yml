name: Auto Post to Telegram

on:
  schedule:
    - cron: "0 7 * * *"    # 10:00 МСК (UTC+3), основной запуск
    - cron: "0 10 * * *"   # резерв на случай задержки/пропуска планировщика GitHub
    - cron: "0 13 * * *"   # второй резерв
  workflow_dispatch: {}    # ручной запуск из UI
  repository_dispatch:
    types: [publish]       # внешний триггер через GitHub API

permissions:
  contents: write          # чтобы коммитить обновлённый topics.json

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Сертификаты Минцифры (нужны для API MAX)
        continue-on-error: true
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: |
          if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 \
               https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt -o /tmp/russian_trusted_root_ca.crt && \
             curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 \
               https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt -o /tmp/russian_trusted_sub_ca.crt; then
            sudo cp /tmp/russian_trusted_root_ca.crt /usr/local/share/ca-certificates/russian_trusted_root_ca.crt
            sudo cp /tmp/russian_trusted_sub_ca.crt /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt
            sudo update-ca-certificates
          else
            echo "::warning::Не удалось скачать сертификаты Минцифры — публикация в MAX может не пройти"
          fi
      - name: Publish post
        id: publish
        continue-on-error: true
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID:   ${{ secrets.TELEGRAM_CHANNEL_ID }}
          MAX_BOT_TOKEN:         ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHANNEL_ID:        ${{ secrets.MAX_CHANNEL_ID }}
          BOT_USERNAME:          ${{ secrets.BOT_USERNAME }}
          MAX_BOT_USERNAME:      ${{ secrets.MAX_BOT_USERNAME }}
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          POLLINATIONS_API_KEY:  ${{ secrets.POLLINATIONS_API_KEY }}
        run: python auto_poster.py
      - name: Mark topic published
        if: always()
        run: |
          git config user.name  "personalartru"
          git config user.email "personalartru@users.noreply.github.com"
          git add topics.json
          git commit -m "chore: mark topic published [skip ci]" || echo "no changes"
          git pull --rebase --autostash origin main || true
          git push
      - name: Fail if publishing failed
        if: steps.publish.outcome == 'failure'
        run: exit 1
