name: Auto Post to Telegram

on:
  schedule:
    - cron: "0 7 * * *"    # 10:00 МСК (UTC+3), основной запуск
    - cron: "0 10 * * *"   # резерв на случай задержки/пропуска планировщика GitHub
    - cron: "0 13 * * *"   # второй резерв
  workflow_dispatch: {}    # ручной запуск из UI
  repository_dispatch:
    types: [publish]       # внешний триггер через GitHub API

permissions:
  contents: write          # чтобы коммитить обновлённый topics.json

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publish post
        env:
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID:   ${{ secrets.TELEGRAM_CHANNEL_ID }}
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          POLLINATIONS_API_KEY:  ${{ secrets.POLLINATIONS_API_KEY }}
        run: python auto_poster.py
      - name: Mark topic published
        run: |
          git config user.name  "personalartru"
          git config user.email "personalartru@users.noreply.github.com"
          git add topics.json
          git commit -m "chore: mark topic published [skip ci]" || echo "no changes"
          git push
